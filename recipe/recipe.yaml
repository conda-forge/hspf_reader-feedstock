schema_version: 1

context:
  name: hspf_reader
  version: "2.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 940df0a3208c1de4da175800283b08c174527998ccba3090e91d45566adfdfb0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - hspf_reader = hspf_reader.hspf_reader:main

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - cltoolbox >=2.0.0,<3.0.0
    - dateparser
    - matplotlib-base >=3.3.2
    - numpy
    - openpyxl >=3.0.7
    - odfpy >=1.4.1
    - pandas
    - pint !=0.21
    - pint-pandas
    - pydantic
    - python >=${{ python_min }}
    - pytables >=3.6.1
    - pyxlsb >=1.0.8
    - scipy
    - tabulate
    - typing-extensions
    - xlrd >=2.0.1
    - xlsxwriter

tests:
  - python:
      imports:
        - hspf_reader
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}
    script:
      - hspf_reader --help

about:
  summary: Command line script and Python library to read HSPF WDM, binary, and plotgen time series.
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/hspf-reader/

extra:
  recipe-maintainers:
    - timcera
